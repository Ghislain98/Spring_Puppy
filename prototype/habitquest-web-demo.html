<style>

  @keyframes flt { 0%{opacity:0;transform:translate(-50%,0) scale(.5)} 14%{opacity:1;transform:translate(calc(-50% + var(--dx)*.3),-12px) scale(1.3) rotate(var(--rot))} 100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-64px) scale(1) rotate(var(--rot))} }

  .leveltoast { position:absolute; left:0; right:0; top:30%; text-align:center; z-index:9; pointer-events:none; font-family:var(--serif); font-size:29px; font-weight:700; color:var(--gold); text-shadow:0 2px 14px #000,0 0 20px var(--goldDim); animation:ltoast 1.2s ease-out forwards; }
  @keyframes ltoast { 0%{opacity:0;transform:translateY(16px) scale(.6)} 22%{opacity:1;transform:translateY(0) scale(1.12)} 78%{opacity:1} 100%{opacity:0;transform:translateY(-24px) scale(1)} }
  .curbox.bump,.cnt.bump { animation:bump .32s ease; } .buy.flash { animation:flashg .5s ease; }

  /* ---- Objectif corporel ---- */
  .winput { width:100%; background:var(--bgEl); border:1.5px solid var(--border); color:var(--text); border-radius:14px; padding:14px; font-size:22px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; }

</style>

const SND=(()=>{
  let ctx, on=(localStorage.getItem('hq-snd')!=='0');
  const AC=()=>ctx||(ctx=new (window.AudioContext||window.webkitAudioContext)());
  function tone(f,dur,type,vol,to){ if(!on)return; try{const c=AC(); if(c.state==='suspended')c.resume();
    const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,c.currentTime);
    if(to)o.frequency.exponentialRampToValueAtTime(to,c.currentTime+dur);
    g.gain.setValueAtTime(vol,c.currentTime); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur);}catch(e){} }
  return {
    hit(){tone(200+Math.random()*50,.06,'square',.04);},
    crit(){tone(520,.12,'sawtooth',.06,940);},
    coin(){tone(880,.07,'triangle',.05,1400);},
    kill(){tone(180,.16,'square',.05,70);},
    boss(){tone(80,.5,'sawtooth',.08,38); setTimeout(()=>tone(240,.3,'square',.05,120),60);},
    buy(){tone(600,.08,'triangle',.06,960);},
    level(){tone(523,.1,'triangle',.06);setTimeout(()=>tone(659,.1,'triangle',.06),80);setTimeout(()=>tone(784,.16,'triangle',.06),160);},
    unlock(){try{const c=AC();if(c.state==='suspended')c.resume();}catch(e){}},
    toggle(){on=!on;localStorage.setItem('hq-snd',on?'1':'0');return on;}, isOn(){return on;}
  };
})();

// valeurs dérivées
function D(){
  const c=CLASSES[S.cls]||CLASSES.guerrier, T=S.tal;
  const b=(buffOn()?1.5:1)*(elanOn()?2:1);
  const ch=(S.body&&S.body.chapters)||0, voie=S.body&&S.body.voie;
  let vDmg=1,vGold=1,vHp=1,vCrit=0,vClick=1;
  if(voie==='agilite'){vDmg=1+0.02*ch; vCrit=Math.min(15,ch); vClick=1.4;}
  else if(voie==='force'){vHp=1+0.05*ch; vDmg=1+0.03*ch;}
  else if(voie==='equilibre'){vGold=1+0.04*ch; vDmg=1+0.01*ch;}
  const pres=1+0.04*(S.reliques||0);
  const dmgMult=c.dmg*(1+0.25*(T.force||0))*b*vDmg*pres;
  const goldMult=c.gold*(1+0.25*(T.cupidite||0))*b*vGold*pres;
  const crit=Math.min(75,BASE.crit+c.crit+5*(T.precision||0)+(S.up.crit||0)*UP_GAIN.crit+vCrit);
  const critF=1+(crit/100)*(CRIT_MULT-1);
  const atk=BASE.atk+S.habit.atk+(S.up.atk||0)*UP_GAIN.atk;
  const maxHp=(BASE.maxHp+S.habit.maxHp+(S.up.maxHp||0)*UP_GAIN.maxHp)*c.hp*vHp;
  const regen=(BASE.regen+S.habit.regen+(S.up.regen||0)*UP_GAIN.regen)*c.regen;
  const dps=atk*critF*dmgMult;
  const clickBase=2+S.level+(S.up.click||0)*3;
  const clickDmg=clickBase*dmgMult*c.click*vClick*(1+1.2*(T.frappe||0));
  const compMult=(1+0.2*(T.tresorier||0))*goldMult;
  const goldSec=COMPANIONS.reduce((a,cp)=>a+(S.comp[cp.id]||0)*cp.rate,0)*compMult;
  const offCap=(8+2*(T.souffle||0))*3600;
  return{c,dmgMult,goldMult,crit,critF,atk,maxHp,regen,dps,clickDmg,goldSec,offCap};
}

        es.map(e=>`<div class="recap"><span>${e.em}</span><span class="lbl">${e.label}</span><span class="p" style="color:${CATS[e.cat].color}">+${e.g}</span><span class="p" style="color:var(--xp)">+${e.xp}</span><span class="p" style="color:var(--gold)">+${e.gold}</span></div>`).join(''));

function sparkline(vals){
  if(vals.length<2)return '<div class="sub" style="text-align:center">Enregistre au moins 2 pesées pour voir ta courbe.</div>';
  const w=280,h=54,pad=5,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>{const x=pad+i/(vals.length-1)*(w-2*pad);const y=pad+(1-(v-mn)/rg)*(h-2*pad);return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

       <input class="winput" id="w0" type="number" inputmode="decimal" placeholder="ex. 72.5"></div>
       <button class="btn-gold" id="startbody">Commencer l'aventure 🎯</button>
       <div class="sub" style="text-align:center;margin-top:10px;line-height:1.5">💚 On récompense la <b>régularité</b>, jamais la vitesse. Aucune punition si ça bouge dans l'autre sens.</div>`;
    let pick=null;
    const grid=document.getElementById('voiegrid');
    grid.innerHTML=Object.entries(VOIES).map(([id,v])=>`<div class="classcard" data-v="${id}" style="grid-column:span 2"><div style="display:flex;align-items:center;gap:10px;text-align:left"><span class="em" style="font-size:28px">${v.em}</span><div><div class="nm" style="font-size:15px">${v.name}</div><div class="ds">${v.ds}</div></div></div></div>`).join('');
    grid.querySelectorAll('[data-v]').forEach(el=>el.onclick=()=>{pick=el.dataset.v;grid.querySelectorAll('.classcard').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');});
    document.getElementById('startbody').onclick=()=>{
      const w=parseFloat(document.getElementById('w0').value);
      if(!pick){alert('Choisis une Voie.');return;}
      if(!(w>20&&w<400)){alert('Entre un poids valide en kg.');return;}
      const dir=VOIES[pick].dir;
      S.body={voie:pick,dir,weight:w,start:w,anchor:w,target:dir==='perte'?w-STEP:dir==='prise'?w+STEP:w,chapter:1,chapters:0,history:[{ts:Date.now(),w}],lastWeighIn:Date.now(),elanUntil:0,unit:'kg'};
      save();SND.buy();haptic(9);renderBody();renderNav();
    };
    return;
  }
  const v=VOIES[B.voie];
  let prog;
  if(B.dir==='maintien')prog=1-Math.min(1,Math.abs(B.weight-B.anchor)/1);
  else if(B.dir==='perte')prog=(B.start-B.weight)/((B.start-B.target)||1);
  else prog=(B.weight-B.start)/((B.target-B.start)||1);
  prog=Math.max(0,Math.min(1,prog));
  const objTxt=B.dir==='maintien'?`Rester autour de ${B.anchor.toFixed(1)} kg (±1)`:`${B.dir==='perte'?'Descendre à':'Monter à'} ${B.target.toFixed(1)} kg`;
  screen.innerHTML=headerHTML('Objectif',`<div class="chapbadge">Ch. ${B.chapter}</div>`)+
    `<div class="card">
       <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-size:28px">${v.em}</span><div><div style="font-family:var(--serif);font-size:17px;font-weight:700">${v.name}</div><div class="sub">Objectif : ${objTxt}</div></div></div>
       <div class="qwrap"><div class="qbar"><i style="width:${(prog*100).toFixed(0)}%"></i></div>
       <div class="qmeta"><span>Départ ${B.start.toFixed(1)}</span><span>${(prog*100).toFixed(0)}%</span><span>Cible ${(B.dir==='maintien'?B.anchor:B.target).toFixed(1)}</span></div></div>
     </div>
     <div class="section"><span>⚖️ Pesée</span></div>
     <div class="card">
       <div class="sub" style="margin-bottom:8px">Actuel : <b style="color:var(--text)">${B.weight.toFixed(1)} kg</b> · <span style="color:var(--faint)">en vrai : 1×/semaine</span></div>
       <input class="winput" id="wnow" type="number" inputmode="decimal" placeholder="${B.weight.toFixed(1)}">
       <button class="btn-gold" style="margin-top:10px" id="weighbtn">Enregistrer ma pesée ⚖️</button>
     </div>
     <div class="section"><span>📜 Chronique du héros</span></div>
     <div class="card">${sparkline(B.history.map(h=>h.w))}</div>
     <div class="section"><span>🌟 Bonus permanent de la Voie</span></div>
     <div class="card sub"><b style="color:var(--gold)">${B.chapters}</b> palier(s) franchi(s) — bonus actif : ${voieBonusText(B)}</div>
     <button class="link" id="changevoie" style="display:block;margin:12px auto">Changer de Voie</button>
     <div style="height:12px"></div>`;
  document.getElementById('weighbtn').onclick=()=>{
    const w=parseFloat(document.getElementById('wnow').value);
    if(!(w>20&&w<400)){alert('Entre un poids valide en kg.');return;}
    weighIn(w);
  };
  document.getElementById('changevoie').onclick=()=>{ if(confirm('Changer de Voie ? Tu gardes tes paliers déjà franchis.')){S.body.voie=null;save();renderBody();} };
}
function weighIn(w){
  const B=S.body, prev=B.weight, now=Date.now();
  B.history.push({ts:now,w}); if(B.history.length>80)B.history.shift();
  const toward=B.dir==='perte'?w<prev:B.dir==='prise'?w>prev:Math.abs(w-B.anchor)<=1;
  const reached=B.dir==='perte'?w<=B.target:B.dir==='prise'?w>=B.target:Math.abs(w-B.anchor)<=1;
  let gold=200*B.chapter, gems=1, elan=false, chapterUp=false;
  if(toward){elan=true; gold+=400*B.chapter;}
  if(reached){
    chapterUp=true; B.chapters++; B.chapter++;
    gems+=3+B.chapters; gold+=1500*B.chapter;
    B.start=w;
    if(B.dir==='perte')B.target=w-STEP; else if(B.dir==='prise')B.target=w+STEP; else B.anchor=w;
  }
  B.weight=w; B.lastWeighIn=now;
  S.gold+=gold; S.gems+=gems;
  if(elan)B.elanUntil=now+24*3600*1000;
  save();
  coffreOverlay({gold,gems,elan,chapterUp,chapter:B.chapter});
}
function coffreOverlay(r){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="big">${r.chapterUp?'🏆':'🎁'}</div>
    <h2>${r.chapterUp?'Palier franchi !':'Coffre de la Constance'}</h2>
    ${r.chapterUp?`<div class="sub" style="margin-top:4px">Nouveau chapitre ${r.chapter} — l'aventure continue, sans fin.</div>`:''}
    <div class="celebRow">
      <div><b style="color:var(--gold)">+${fmt(r.gold)}</b><span>or</span></div>
      <div><b style="color:var(--gem)">+${r.gems}</b><span>💎</span></div>
      ${r.elan?`<div><b style="color:var(--regen)">⚡×2</b><span>24h</span></div>`:''}
    </div>
    <div class="sub" style="margin-bottom:16px">${r.elan?`Élan activé : <b style="color:var(--regen)">×2 or & dégâts</b> pendant 24h !`:`Merci d'avoir pris soin de toi. 💚`}</div>
    <button class="btn-gold" style="max-width:260px" id="cofok">Foncer au donjon ⚔️</button>`;
  document.querySelector('.phone').appendChild(ov);
  SND.level(); haptic([10,30,10]);
  document.getElementById('cofok').onclick=()=>{ov.remove();go('dungeon');};
}

// ============ Boucle idle (100ms) ============
let autoAcc=0, floatAcc=0;
setInterval(()=>{
  const d=D(),dt=0.1;
  S.gold+=d.goldSec*dt;
  // combat auto
  let hp=Math.min(d.maxHp,S.hp+d.regen*dt)-monsterAtk(S.floor,S.mi)*dt;
  if(hp<=0){S.hp=d.maxHp;S.mhp=monsterMaxHp(S.floor,S.mi);pushLog('💀 Héros terrassé étage '+S.floor+', il se relève !');save();updateDungeon(true);}
  else{S.hp=hp; autoAcc+=d.dps*dt;
    // applique les dégâts auto en continu, floats périodiques
    S.mhp-=d.dps*dt; S.totalDmg+=d.dps*dt;
    floatAcc+=dt;
    if(floatAcc>=0.5){ if(tab==='dungeon')spawnFloat(fmt(d.dps*0.5),'var(--hp)',false); floatAcc=0; }
    if(S.mhp<=0)killMonster(); else updateDungeon(false);
  }
  checkAch();
  if(tab!=='dungeon')renderCur();
  if(!S._t||Date.now()-S._t>4000){S._t=Date.now();save();}
},100);

// ============ Démarrage ============
render();
(function(){
  const mb=document.getElementById('mute');
  if(mb){ mb.textContent=SND.isOn()?'🔊':'🔇'; mb.onclick=()=>{const on=SND.toggle();mb.textContent=on?'🔊':'🔇';SND.unlock();}; }
  window.addEventListener('pointerdown',()=>SND.unlock(),{once:true});
})();
if(!S.cls){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="big">🦸</div><h2>Choisis ta classe</h2><div class="sub" style="margin:6px 0 16px">Tu pourras en changer plus tard (5 💎).</div><div class="classgrid" id="pick" style="width:100%;max-width:340px"></div>`;
  document.querySelector('.phone').appendChild(ov);
  document.getElementById('pick').innerHTML=Object.entries(CLASSES).map(([id,c])=>`<div class="classcard" data-p="${id}"><div class="em">${c.em}</div><div class="nm">${c.name}</div><div class="ds">${c.ds}</div></div>`).join('');
  ov.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>{S.cls=el.dataset.p;save();ov.remove();render();});
}
if(offlineMsg){
  const lbl=offlineMsg.min>=60?Math.floor(offlineMsg.min/60)+'h'+String(offlineMsg.min%60).padStart(2,'0'):offlineMsg.min+' min';
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="big">🌙</div><h2>Pendant ton absence</h2><div class="sub" style="margin-top:4px">Le donjon a continué de rapporter (${lbl}).</div>
    <div class="celebRow"><div><b style="color:var(--gold)">+${fmt(offlineMsg.g)}</b><span>or</span></div><div><b style="color:var(--xp)">+${fmt(offlineMsg.x)}</b><span>XP</span></div></div>
    <button class="btn-gold" style="max-width:220px" id="ok">Récupérer</button>`;
  document.querySelector('.phone').appendChild(ov);
  document.getElementById('ok').onclick=()=>ov.remove();
}
// braises d'ambiance
for(let i=0;i<10;i++){const e=document.createElement('div');e.className='ember';e.style.left=(Math.random()*100)+'%';e.style.animationDuration=(6+Math.random()*7)+'s';e.style.animationDelay=(-Math.random()*10)+'s';document.body.appendChild(e);}
</script>
